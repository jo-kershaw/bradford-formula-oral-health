[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bradford-formula-oral-health"
version = "0.1.0"
description = "Analysis of low-allergy infant formula prescribing and oral health outcomes."
authors = [
    {name = "Jo Kershaw"}
]
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"

dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
